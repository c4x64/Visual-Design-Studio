name: Visual Design Studio Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: vscode/.nvmrc

      - name: Install build tools
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        run: |
          cd vscode
          npm install --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run postinstall
        run: |
          cd vscode
          node build/npm/postinstall.ts

      - name: Type check client
        run: |
          cd vscode
          npx tsc --project ./src/tsconfig.json --noEmit --skipLibCheck

      - name: Compile client
        run: |
          cd vscode
          npx tsc --project ./src/tsconfig.json --skipLibCheck
